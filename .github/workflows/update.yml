name: Base Gas Tracker
on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gas
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          BASE_GWEI=$(curl -s -X POST https://mainnet.base.org \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_gasPrice","params":[],"id":1}' \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(round(int(d['result'], 16) / 1e9, 4))
          except:
              print('N/A')
          ")
          ETH_GWEI=$(curl -s -X POST https://eth.llamarpc.com \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_gasPrice","params":[],"id":1}' \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(round(int(d['result'], 16) / 1e9, 4))
          except:
              print('N/A')
          ")
          echo "| $DATE | Base: ${BASE_GWEI} gwei | ETH: ${ETH_GWEI} gwei |" >> gas_log.md
      - name: Commit
        run: |
          git config user.email "aonishchenko93@mail.ru"
          git config user.name "Alexeyyyyyy"
          git add .
          git commit -m "gas: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
